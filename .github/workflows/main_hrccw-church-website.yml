name: Build and deploy Node.js app to Azure Web App - hrccw-church-website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install and Build
        run: |
          npm ci
          npm run build
      - name: Zip artifact for deployment
        run: zip -r app.zip dist server package.json package-lock.json -x "node_modules/*"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'hrccw-church-website'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: app.zip