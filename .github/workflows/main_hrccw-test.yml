# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test, type-check, and build
        run: |
          npm run test:server
          npx tsc --noEmit
          npm run build

      - name: Prepare production package
        run: |
          npm prune --omit=dev
          mkdir -p deploy/src/data
          cp package.json package-lock.json deploy/
          cp -R node_modules dist server deploy/
          cp src/data/ordoCalendar.json deploy/src/data/

      - name: Upload production package
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: deploy/
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download production package
        uses: actions/download-artifact@v4
        with:
          name: app-package
          path: deploy

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'hrccw-test'
          slot-name: 'Production'
          package: deploy
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_EF10B659E93948D4BC9582E473F4708B }}